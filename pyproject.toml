[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-sag"
version = "0.1.0"
description = "Physics-informed gray-box neural model of guitar amplifier power supply sag"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Power Sag Model contributors" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7.0", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
